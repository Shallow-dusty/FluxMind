# Example systemd drop-in for FluxMind Docker execution.
#
# Install this content as a drop-in for every service that may execute code:
#   /etc/systemd/system/fluxmind-api.service.d/docker-execution.conf
#   /etc/systemd/system/fluxmind-ui.service.d/docker-execution.conf
#   /etc/systemd/system/fluxmind-worker.service.d/docker-execution.conf
#
# The docker group must exist, and the fluxmind runtime user must be allowed to
# access the Docker daemon. Run `systemctl daemon-reload` and restart the target
# services after installing drop-ins.

[Service]
SupplementaryGroups=docker
Environment=CODE_EXECUTION_BACKEND=docker
Environment=DOCKER_PYTHON_EXECUTION_IMAGE=m.daocloud.io/docker.io/library/python:3.11-slim
Environment=DOCKER_OCTAVE_EXECUTION_IMAGE=fluxmind/octave:trixie-slim
